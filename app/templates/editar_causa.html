{% extends 'layout.html' %}

{% block titulo %}Editar Causa de Recusa{% endblock %}

{% block conteudo %}
<h2 class="mb-4 text-center text-laranja">EDITAR CAUSA DE RECUSA</h2>
<hr>

<form method="POST">
  <div class="mb-3">
    <label for="descricao" class="form-label">Descrição</label>
    <input type="text" class="form-control" id="descricao" name="descricao" value="{{ causa.descricao }}" required>
  </div>
  <div class="d-flex justify-content-between">
    <button type="submit" class="btn btn-laranja">Salvar</button>
    <a href="/causas_recusa" class="btn btn-cinza">Voltar</a>
  </div>
</form>
{% endblock %}
