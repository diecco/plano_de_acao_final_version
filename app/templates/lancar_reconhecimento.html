{% extends "layout.html" %}

{% block titulo %}Lançar Reconhecimento{% endblock %}

{% block conteudo %}

<div class="d-flex align-items-center justify-content-between mb-4">

    <div style="width: 40px;"></div>

    <div class="text-center flex-grow-1">
        <h2 class="page-title">
            <i class="bi bi-award me-2"></i>
            Cadastrar Reconhecimento
        </h2>
    </div>

    <div style="width: 40px;"></div>

</div>

<div class="page-header-line"></div>
<hr>

<form method="POST" action="/lancar_reconhecimento">
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <h5 class="text-laranja mb-3">Dados do Reconhecimento</h5>

            <div class="row g-3">
                <!-- Apoiador -->
                <div class="col-md-5">
                    <label class="form-label">Apoiador</label>
                    <select name="apoiador_id" class="form-select" required>
                        <option value="">Selecione...</option>
                        {% for u in usuarios %}
                            <option value="{{ u.id }}">
                                {{ u.nome }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <!-- Reconhecido -->
                <div class="col-md-5">
                    <label class="form-label">Reconhecido</label>
                    <select name="id_reconhecido" class="form-select" required>
                        <option value="">Selecione...</option>
                        {% for u in usuarios %}
                            <option value="{{ u.id }}">{{ u.nome }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Data -->
                <div class="col-md-2">
                    <label class="form-label">Data</label>
                    <input type="date"
                           class="form-control"
                           name="data_reconhecimento"
                           value=""
                           required>
                </div>
            </div>

            <div class="mt-3">
                <label class="form-label">Reconhecimento</label>
                <textarea class="form-control"
                          name="reconhecimento"
                          rows="4"
                          placeholder="Descreva o reconhecimento"
                          required></textarea>
            </div>

            <div class="d-flex justify-content-between mt-3">
                <a href="/listar_reconhecimento" class="btn btn-cinza">Voltar</a>
                <button type="submit" class="btn btn-laranja">Salvar</button>
            </div>
        </div>
    </div>
</form>

{% endblock %}
