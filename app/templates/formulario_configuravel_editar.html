{% extends 'layout.html' %}{% block titulo %}Configurar formulário{% endblock %}{% block extra_css %}<style>.form-builder-control label{font-size:.82rem}.form-check{font-size:.85rem}</style>{% endblock %}
{% block conteudo %}<div class="page-header"><h2 class="page-title text-center mb-0"><i class="bi bi-file-earmark-text me-2"></i>{{ modelo.nome }}</h2></div><hr>
<form method="post" id="formBuilderForm"><input type="hidden" id="estrutura_json" name="estrutura_json" value='{{ estrutura|e }}'>
<div class="card border-0 shadow-sm mb-4"><div class="card-body"><div class="row g-3"><div class="col-lg-6"><label class="form-label">Nome</label><input class="form-control" name="nome" value="{{ modelo.nome }}" required></div><div class="col-lg-6"><label class="form-label">Descrição</label><input class="form-control" name="descricao" value="{{ modelo.descricao or '' }}"></div></div></div></div>
<div data-form-builder><div data-fields></div><button type="button" class="btn btn-outline-secondary" data-add-field>Adicionar campo</button><p class="form-text" data-field-count></p></div>
<div class="d-flex justify-content-between mt-4"><a class="btn btn-cinza" href="{{ url_for('main.formularios_configuraveis') }}">Voltar</a><button class="btn btn-laranja">Salvar</button></div></form>
<script src="{{ url_for('static',filename='js/formulario-builder.js') }}"></script>{% endblock %}
