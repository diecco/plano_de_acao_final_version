{% extends "layout.html" %}

{% block titulo %}Editar Movimentação{% endblock %}

{% block conteudo %}

<div class="page-header">
    <h2 class="page-title">
        <i class="bi bi-pencil-square me-2"></i>
        Editar Movimentação
    </h2>
</div>

<hr>

<div class="card shadow-sm border-0 mb-4">
    <div class="card-body">

        <h5 class="text-laranja mb-3">
            Dados da Movimentação
        </h5>

        <div class="row g-3 mb-3">

            <div class="col-md-4">
                <label class="form-label">Equipamento</label>
                <input type="text"
                       class="form-control"
                       value="{{ movimentacao.codigo_frota }}"
                       readonly>
            </div>

            <div class="col-md-4">
                <label class="form-label">Tipo de Movimentação</label>
                <input type="text"
                       class="form-control"
                       value="{% if movimentacao.tipo_movimentacao == 'retirada' %}Retirada da área{% elif movimentacao.tipo_movimentacao == 'entrega' %}Entrega na área{% else %}{{ movimentacao.tipo_movimentacao }}{% endif %}"
                       readonly>
            </div>

            <div class="col-md-4">
                <label class="form-label">Motivo</label>
                <input type="text"
                       class="form-control"
                       value="{{ movimentacao.motivo_movimentacao }}"
                       readonly>
            </div>

        </div>

        <form method="POST"
              action="{{ url_for('main.editar_pcpm_movimentacao', movimentacao_id=movimentacao.id) }}">

            <div class="row g-3">

                <div class="col-md-6">
                    <label for="numero_os" class="form-label">OS Fluig / TOTVS</label>
                    <input type="text"
                           name="numero_os"
                           id="numero_os"
                           class="form-control"
                           maxlength="50"
                           value="{{ movimentacao.numero_os or '' }}">
                </div>

                <div class="col-md-6">
                    <label for="horimetro" class="form-label">Horímetro</label>
                    <input type="number"
                           name="horimetro"
                           id="horimetro"
                           class="form-control"
                           min="0"
                           step="0.1"
                           required
                           value="{{ movimentacao.horimetro }}">
                </div>

                <div class="col-12">
                    <label for="descricao_anomalia" class="form-label">Relato / Condições Encontradas</label>
                    <textarea name="descricao_anomalia"
                              id="descricao_anomalia"
                              class="form-control"
                              rows="5"
                              required>{{ movimentacao.descricao_anomalia or '' }}</textarea>
                </div>

            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">

                <a href="{{ url_for('main.pcpm_painel_movimentacoes') }}"
                   class="btn btn-cinza">
                    Voltar
                </a>

                <button type="submit"
                        class="btn btn-laranja">
                    <i class="bi bi-save"></i>
                    Salvar alterações
                </button>

            </div>

        </form>

    </div>
</div>

{% endblock %}
