{% extends 'layout.html' %}
{% block conteudo %}

<div class="page-header">
    <h2 class="page-title">
        <i class="bi bi-plus-circle me-2"></i>
        Cadastro de Ações
    </h2>
</div>
<hr>

<form method="POST" action="/cadastrar_acao" id="formCadastrarAcao">
    <!-- Linha 1: Origem e Responsável -->
    <div class="row mb-3">
        <div class="col-md-6">
            <label for="origem_id" class="form-label">Origem da ação</label>
            <select name="origem_id" id="origem_id" class="form-select" required>
                <option value="">Selecione</option>
                {% for origem in origens %}
                    <option value="{{ origem.id }}">{{ origem.descricao }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-6 position-relative">
            <label for="responsavel_busca" class="form-label">Responsável</label>

            <input type="hidden"
                   name="responsavel_id"
                   id="responsavel_id">

            <input type="text"
                   id="responsavel_busca"
                   class="form-control"
                   placeholder="Digite matrícula ou nome..."
                   autocomplete="off"
                   required>

            <div id="listaResponsaveis"
                 class="list-group position-absolute w-100 shadow-sm"
                 style="z-index: 1050; display: none; max-height: 240px; overflow-y: auto;">
            </div>
        </div>
    </div>

    <!-- Linha 2: Descrição -->
    <div class="mb-3">
        <label for="descricao" class="form-label">Descrição da Ação</label>
        <textarea name="descricao" id="descricao" class="form-control" rows="4" required></textarea>
    </div>

    <!-- Linha 3: Prazo e Status -->
    <div class="row mb-4">
        <div class="col-md-6">
            <label for="prazo" class="form-label">Prazo</label>
            <input type="date" name="prazo" id="prazo" class="form-control" required>
        </div>

        <div class="col-md-6">
            <label for="status" class="form-label">Status</label>
            <select name="status" id="status" class="form-select" required>
                <option value="Não iniciada">Não iniciada</option>
                <option value="Em andamento">Em andamento</option>
                <option value="Concluída">Concluída</option>
                <option value="Cancelada">Cancelada</option>
            </select>
        </div>
    </div>

    <!-- Botões -->
    <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-laranja">Salvar</button>
        <a href="/dashboard" class="btn btn-cinza">Voltar</a>
    </div>
</form>

<script id="usuarios-data" type="application/json">
    {{ usuarios | tojson }}
</script>

<script>
const usuariosDisponiveis = JSON.parse(
    document.getElementById('usuarios-data').textContent
);

function normalizarTexto(texto) {
    return String(texto || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '');
}

function formatarUsuario(usuario) {
    const matricula = usuario.matricula || 'Sem matrícula';
    const nome = usuario.nome || '';
    return `${matricula} - ${nome}`;
}

function configurarBuscaResponsavel() {
    const input = document.getElementById('responsavel_busca');
    const hidden = document.getElementById('responsavel_id');
    const lista = document.getElementById('listaResponsaveis');

    if (!input || !hidden || !lista) return;

    input.addEventListener('input', function () {
        const termo = normalizarTexto(input.value);

        hidden.value = '';
        lista.innerHTML = '';
        lista.style.display = 'none';

        if (termo.length < 2) {
            return;
        }

        const resultados = usuariosDisponiveis
            .filter(u => {
                const textoBusca = normalizarTexto(`${u.matricula || ''} ${u.nome || ''}`);
                return textoBusca.includes(termo);
            })
            .slice(0, 12);

        if (resultados.length === 0) {
            lista.innerHTML = `
                <div class="list-group-item text-muted">
                    Nenhum funcionário encontrado.
                </div>
            `;
            lista.style.display = 'block';
            return;
        }

        resultados.forEach(usuario => {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'list-group-item list-group-item-action text-start';

            item.innerHTML = `
                <strong>${usuario.matricula || '-'}</strong><br>
                <small>${usuario.nome || ''}</small>
            `;

            item.addEventListener('click', function () {
                input.value = formatarUsuario(usuario);
                hidden.value = usuario.id;
                lista.style.display = 'none';
            });

            lista.appendChild(item);
        });

        lista.style.display = 'block';
    });

    input.addEventListener('blur', function () {
        setTimeout(function () {
            lista.style.display = 'none';
        }, 200);
    });
}

document.addEventListener('DOMContentLoaded', function () {
    configurarBuscaResponsavel();

    const form = document.getElementById('formCadastrarAcao');
    const input = document.getElementById('responsavel_busca');
    const hidden = document.getElementById('responsavel_id');

    if (form) {
        form.addEventListener('submit', function (e) {
            if (!hidden.value) {
                alert('Selecione um responsável válido na lista.');
                input.focus();
                e.preventDefault();
            }
        });
    }
});
</script>

{% endblock %}
